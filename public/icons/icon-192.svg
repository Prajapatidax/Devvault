<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="36" fill="#09090b"/>
  <rect width="192" height="192" rx="36" fill="url(#bg-glow)" opacity="0.6"/>
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#ff5c00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield / Outer Shield Container -->
  <path d="M 96 32 L 148 54 V 104 C 148 136 122 158 96 168 C 70 158 44 136 44 104 V 54 Z" 
        fill="none" 
        stroke="url(#brand-grad)" 
        stroke-width="7" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Lock & Code Brackets -->
  <rect x="76" y="92" width="40" height="34" rx="6" fill="#4f46e5" opacity="0.9"/>
  <path d="M 84 92 V 80 C 84 73 90 67 96 67 C 102 67 108 73 108 80 V 92" 
        fill="none" 
        stroke="#818cf8" 
        stroke-width="5" 
        stroke-linecap="round"/>

  <!-- Keyhole -->
  <circle cx="96" cy="106" r="4" fill="#ffffff"/>
  <path d="M 96 106 L 96 116" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
