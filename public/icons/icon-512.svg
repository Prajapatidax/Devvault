<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#09090b"/>
  <rect width="512" height="512" rx="96" fill="url(#bg-glow)" opacity="0.6"/>
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#ff5c00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield / Outer Shield Container -->
  <path d="M 256 85 L 395 144 V 277 C 395 362 325 421 256 448 C 187 421 117 362 117 277 V 144 Z" 
        fill="none" 
        stroke="url(#brand-grad)" 
        stroke-width="18" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Lock & Code Brackets -->
  <rect x="202" y="245" width="108" height="90" rx="16" fill="#4f46e5" opacity="0.9"/>
  <path d="M 224 245 V 213 C 224 195 238 178 256 178 C 274 178 288 195 288 213 V 245" 
        fill="none" 
        stroke="#818cf8" 
        stroke-width="14" 
        stroke-linecap="round"/>

  <!-- Keyhole -->
  <circle cx="256" cy="282" r="10" fill="#ffffff"/>
  <path d="M 256 282 L 256 310" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
</svg>
